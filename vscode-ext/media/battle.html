<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<title>Tetris Battle</title>
<style>
  :root {
    --bg: #0a0a0f;
    --grid-bg: #0d0d18;
    --grid-line: #1a1a2e;
    --text: #e0e0e0;
    --accent: #00ffaa;
    --accent-dim: #00ffaa33;
    --glow: 0 0 10px #00ffaa66, 0 0 30px #00ffaa22;
    --danger: #ff1744;
    --warning: #ffd600;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New','Consolas',monospace;
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; overflow:hidden; user-select:none;
  }
  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
  }

  .app { display:flex; flex-direction:column; align-items:center; gap:16px; animation:fadeIn .5s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  /* ── Top bar ── */
  .top-bar {
    display:flex; align-items:center; gap:24px;
    font-size:11px; color:#888;
  }
  .top-bar .room-id { color:var(--accent); font-weight:bold; }
  .top-bar .vs { font-size:16px; font-weight:bold; color:var(--danger); }

  .player-name {
    font-size:13px; font-weight:bold; color:#fff;
    text-align:center; padding:4px 12px;
    border-radius:4px; background:#1a1a2e;
  }
  .player-name.me { border:1px solid var(--accent-dim); }
  .player-name.op { border:1px solid #ff174433; }

  /* ── Battle area ── */
  .battle-area {
    display:flex; gap:20px; align-items:flex-start;
  }

  /* ── Board container ── */
  .board-col {
    display:flex; flex-direction:column; gap:8px; align-items:center;
  }
  .board-frame {
    position:relative; border-radius:6px; overflow:hidden;
  }
  .board-frame.me { border:2px solid var(--accent-dim); box-shadow:var(--glow); }
  .board-frame.op { border:2px solid #ff174422; }

  /* ── Center stats ── */
  .center-col {
    display:flex; flex-direction:column; gap:12px;
    align-items:center; width:100px; padding-top:30px;
  }
  .stat-box {
    background:var(--grid-bg); border:1px solid var(--grid-line);
    border-radius:6px; padding:8px 10px; width:100%; text-align:center;
  }
  .stat-label { font-size:8px; color:var(--accent); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  .stat-val { font-size:16px; font-weight:bold; color:#fff; }

  /* ── Attack indicator ── */
  .attack-bar {
    width:100%; height:8px; background:#1a1a2e;
    border-radius:4px; overflow:hidden; margin-top:4px;
  }
  .attack-fill {
    height:100%; width:0%; background:var(--danger);
    transition:width 0.3s; border-radius:4px;
  }
  .attack-label { font-size:8px; color:var(--danger); letter-spacing:1px; text-align:center; }

  /* ── Pending garbage ── */
  .garbage-bar {
    position:absolute; left:-14px; bottom:0; width:8px;
    background:transparent; display:flex; flex-direction:column-reverse;
  }
  .garbage-segment {
    width:8px; height:15px; background:var(--danger);
    border-radius:2px; margin-top:1px;
    animation:garbagePulse 0.8s ease infinite alternate;
  }
  @keyframes garbagePulse { from{opacity:0.6} to{opacity:1} }

  /* ── Mini panels (hold / next) ── */
  .mini-panels { display:flex; gap:8px; }
  .mini-box {
    background:var(--grid-bg); border:1px solid var(--grid-line);
    border-radius:4px; padding:6px; text-align:center;
  }
  .mini-label { font-size:7px; color:var(--accent); letter-spacing:1px; margin-bottom:4px; }

  /* ── Lobby ── */
  .lobby {
    display:flex; flex-direction:column; align-items:center;
    gap:16px; padding:40px;
  }
  .lobby h1 { font-size:22px; font-weight:bold; color:var(--accent); text-shadow:var(--glow); }
  .lobby .sub { font-size:12px; color:#888; }
  .lobby input {
    background:#1a1a2e; border:1px solid var(--grid-line);
    color:#fff; padding:8px 14px; border-radius:6px;
    font-family:inherit; font-size:13px; width:220px; text-align:center;
    outline:none;
  }
  .lobby input:focus { border-color:var(--accent); }
  .lobby input::placeholder { color:#555; }
  .btn {
    padding:10px 24px; border-radius:6px; font-family:inherit;
    font-size:12px; font-weight:bold; cursor:pointer;
    letter-spacing:1px; transition:all 0.2s; border:none;
  }
  .btn-primary { background:var(--accent); color:#0a0a0f; }
  .btn-primary:hover { opacity:0.85; }
  .btn-secondary { background:transparent; border:1px solid #555; color:#aaa; }
  .btn-secondary:hover { border-color:#888; color:#fff; }
  .btn-row { display:flex; gap:10px; }
  .btn-small { padding:6px 14px; font-size:10px; }

  .status-text {
    font-size:12px; color:var(--warning);
    animation:blink 1.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .hidden { display:none !important; }

  /* ── Result overlay ── */
  .result-overlay {
    position:fixed; inset:0; display:none;
    justify-content:center; align-items:center;
    background:rgba(10,10,15,0.9); backdrop-filter:blur(6px); z-index:100;
  }
  .result-overlay.visible { display:flex; }

  /* ── Ready overlay ── */
  .ready-overlay {
    position:fixed; inset:0; display:none;
    justify-content:center; align-items:center;
    background:rgba(10,10,15,0.88); backdrop-filter:blur(4px); z-index:90;
  }
  .ready-overlay.visible { display:flex; }
  .ready-box {
    text-align:center;
    background:var(--grid-bg);
    border:1px solid var(--accent-dim);
    border-radius:8px;
    padding:28px 40px;
    box-shadow:var(--glow);
  }
  .ready-title { font-size:20px; font-weight:bold; color:var(--accent); margin-bottom:6px; letter-spacing:2px; }
  .ready-sub { font-size:11px; color:#888; margin-bottom:20px; }
  .ready-row {
    display:flex; justify-content:center; gap:32px;
    margin-bottom:22px; font-size:11px;
  }
  .ready-slot { display:flex; flex-direction:column; gap:4px; align-items:center; }
  .ready-slot .name { color:#ccc; font-weight:bold; }
  .ready-slot .state { font-size:10px; letter-spacing:1px; color:#666; }
  .ready-slot.ready .state { color:var(--accent); }
  .btn-primary:disabled {
    background:#1a1a2e; color:#555; cursor:not-allowed;
  }
  .result-box { text-align:center; }
  .result-title { font-size:28px; font-weight:bold; margin-bottom:8px; }
  .result-title.win { color:var(--accent); text-shadow:var(--glow); }
  .result-title.lose { color:var(--danger); }
  .result-sub { font-size:12px; color:#888; margin-bottom:20px; }
  .result-stats { font-size:11px; color:#aaa; margin-bottom:20px; line-height:2; }
</style>
</head>
<body tabindex="0">

<!-- ═══ LOBBY SCREEN ═══ -->
<div class="lobby" id="lobby">
  <h1>TETRIS BATTLE</h1>
  <p class="sub">連線對戰 — 消行攻擊模式</p>

  <input id="nameInput" placeholder="輸入你的暱稱" maxlength="12"/>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="joinRandom()">隨機配對</button>
    <button class="btn btn-secondary" onclick="showPrivate()">私人房間</button>
  </div>

  <div id="privateSection" class="hidden">
    <input id="roomInput" placeholder="輸入房間代碼" maxlength="6" style="margin-bottom:8px;text-transform:uppercase"/>
    <div class="btn-row">
      <button class="btn btn-primary btn-small" onclick="joinRoom()">加入房間</button>
      <button class="btn btn-secondary btn-small" onclick="createRoom()">建立房間</button>
    </div>
  </div>

  <div id="statusText" class="status-text hidden"></div>
  <p class="sub" style="margin-top:20px;font-size:9px;color:#444">
    Server: <span id="serverAddr">__SERVER_URL__</span>
  </p>
</div>

<!-- ═══ BATTLE SCREEN ═══ -->
<div class="app hidden" id="battleScreen">
  <div class="top-bar">
    <div class="player-name me" id="myNameTag">ME</div>
    <div class="vs">VS</div>
    <div class="player-name op" id="opNameTag">???</div>
    <span style="margin-left:12px">Room: <span class="room-id" id="roomIdTag">---</span></span>
  </div>

  <div class="battle-area">
    <!-- My board -->
    <div class="board-col">
      <div class="mini-panels">
        <div class="mini-box">
          <div class="mini-label">HOLD</div>
          <canvas id="myHold" width="60" height="48"></canvas>
        </div>
        <div class="mini-box">
          <div class="mini-label">NEXT</div>
          <canvas id="myNext" width="60" height="130"></canvas>
        </div>
      </div>
      <div style="position:relative">
        <div class="garbage-bar" id="myGarbageBar"></div>
        <div class="board-frame me">
          <canvas id="myBoard" width="240" height="480"></canvas>
        </div>
      </div>
    </div>

    <!-- Center stats -->
    <div class="center-col">
      <div class="stat-box">
        <div class="stat-label">Score</div>
        <div class="stat-val" id="myScore">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Lines</div>
        <div class="stat-val" id="myLines">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Level</div>
        <div class="stat-val" id="myLevel">1</div>
      </div>
      <div style="width:100%;margin-top:8px;">
        <div class="attack-label">ATTACK</div>
        <div class="attack-bar"><div class="attack-fill" id="attackFill"></div></div>
      </div>
      <div class="stat-box" style="margin-top:auto">
        <div class="stat-label">Time</div>
        <div class="stat-val" id="gameTime" style="font-size:12px">00:00</div>
      </div>
      <button class="btn btn-secondary btn-small" onclick="surrenderGame()" style="margin-top:8px;width:100%">QUIT</button>
    </div>

    <!-- Opponent board -->
    <div class="board-col">
      <div style="text-align:center;margin-bottom:8px">
        <span style="font-size:9px;color:#888;letter-spacing:1px">OPPONENT</span>
      </div>
      <div class="board-frame op">
        <canvas id="opBoard" width="180" height="360"></canvas>
      </div>
      <div style="display:flex;gap:16px;margin-top:8px;font-size:10px;color:#666">
        <span>Score: <span id="opScore" style="color:#fff">0</span></span>
        <span>Lines: <span id="opLines" style="color:#fff">0</span></span>
      </div>
    </div>
  </div>
</div>

<!-- ═══ READY OVERLAY ═══ -->
<div class="ready-overlay" id="readyOverlay">
  <div class="ready-box">
    <div class="ready-title">READY?</div>
    <div class="ready-sub">雙方都按下 START 才會開始遊戲</div>
    <div class="ready-row">
      <div class="ready-slot" id="myReadySlot">
        <div class="name" id="myReadyName">ME</div>
        <div class="state" id="myReadyState">NOT READY</div>
      </div>
      <div class="ready-slot" id="opReadySlot">
        <div class="name" id="opReadyName">???</div>
        <div class="state" id="opReadyState">NOT READY</div>
      </div>
    </div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" id="startBtn" onclick="sendReady()">START</button>
      <button class="btn btn-secondary btn-small" onclick="backToLobby()">CANCEL</button>
    </div>
  </div>
</div>

<!-- ═══ RESULT OVERLAY ═══ -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-box">
    <div class="result-title" id="resultTitle">YOU WIN!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-stats" id="resultStats"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" onclick="backToLobby()">BACK TO LOBBY</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════
const SERVER_URL = '__SERVER_URL__';
const DEFAULT_NAME = '__PLAYER_NAME__';
document.getElementById('nameInput').value = DEFAULT_NAME;

const COLS = 10;
const ROWS = 20;
const BLOCK_SIZE = 24;
const OP_BLOCK_SIZE = 18;
const SPAWN_X = 3;
const SPAWN_Y = -2;
const LOCK_DELAY_MS = 500;
const MAX_LOCK_MOVES = 15;
const SYNC_INTERVAL_MS = 200;
const HEARTBEAT_INTERVAL_MS = 10000;
const BOARD_BG = '#0d0d18';
const GRID_LINE = '#1a1a2e';

const COLORS = {
  I: '#00e5ff', O: '#ffd600', T: '#d500f9',
  S: '#00e676', Z: '#ff1744', J: '#2979ff', L: '#ff9100',
  G: '#555555'
};

const SHAPES = {
  I: [[0,0],[1,0],[2,0],[3,0]],
  O: [[0,0],[1,0],[0,1],[1,1]],
  T: [[0,0],[1,0],[2,0],[1,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]],
  J: [[0,0],[0,1],[1,1],[2,1]],
  L: [[2,0],[0,1],[1,1],[2,1]]
};

const KICKS = [
  [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
  [[0,0],[1,0],[1,1],[0,-2],[1,-2]],
  [[0,0],[1,0],[1,-1],[0,2],[1,2]],
  [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]]
];

// ═══════════════════════════════════════════
//  CANVAS CONTEXTS
// ═══════════════════════════════════════════
const myCx = document.getElementById('myBoard').getContext('2d');
const myHoldCx = document.getElementById('myHold').getContext('2d');
const myNextCx = document.getElementById('myNext').getContext('2d');
const opCx = document.getElementById('opBoard').getContext('2d');

// ═══════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════
let grid;
let currentPiece;
let nextQueue;
let heldPiece;
let canHold;
let score, lines, level;
let dropInterval, dropTimer;
let lockTimer, lockMoveCount;
let lastFrameTime;
let pieceBag = [];
let gameActive = false;
let pendingGarbage = 0;
let gameStartMs = 0;
let syncTimer = 0;

// ═══════════════════════════════════════════
//  NETWORK
// ═══════════════════════════════════════════
let ws = null;
let connected = false;
let heartbeatInterval = null;

function wsConnect(onOpen) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    if (onOpen) onOpen();
    return;
  }
  setStatus('正在連線到伺服器...');
  ws = new WebSocket(SERVER_URL);

  ws.onopen = () => {
    connected = true;
    clearInterval(heartbeatInterval);
    heartbeatInterval = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, HEARTBEAT_INTERVAL_MS);
    if (onOpen) onOpen();
  };

  ws.onclose = () => {
    connected = false;
    clearInterval(heartbeatInterval);
    if (gameActive) showResult(false, 'Connection lost');
  };

  ws.onerror = (err) => {
    console.error('WebSocket error:', err);
    setStatus('連線失敗！請確認伺服器地址是否正確');
  };

  ws.onmessage = (e) => handleServerMsg(JSON.parse(e.data));
}

function wsSend(type, data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type, data }));
  }
}

function setStatus(text) {
  const el = document.getElementById('statusText');
  el.textContent = text;
  el.classList.remove('hidden');
}

// ═══════════════════════════════════════════
//  LOBBY
// ═══════════════════════════════════════════
function showPrivate() {
  document.getElementById('privateSection').classList.toggle('hidden');
}

function getMyName() {
  return document.getElementById('nameInput').value.trim() || DEFAULT_NAME;
}

function joinRandom() {
  setStatus('正在搜尋對手...');
  wsConnect(() => wsSend('join', { name: getMyName() }));
}

function joinRoom() {
  const roomId = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!roomId) return;
  setStatus('加入房間 ' + roomId + '...');
  wsConnect(() => wsSend('join', { name: getMyName(), room_id: roomId }));
}

function createRoom() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let rid = '';
  for (let i = 0; i < 6; i++) rid += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('roomInput').value = rid;
  setStatus('房間 ' + rid + ' 已建立,等待對手加入...');
  wsConnect(() => wsSend('join', { name: getMyName(), room_id: rid }));
}

function backToLobby() {
  document.getElementById('resultOverlay').classList.remove('visible');
  hideReadyOverlay();
  document.getElementById('battleScreen').classList.add('hidden');
  document.getElementById('lobby').classList.remove('hidden');
  document.getElementById('statusText').classList.add('hidden');
  gameActive = false;
  if (ws) ws.close();
}

// ═══════════════════════════════════════════
//  READY OVERLAY
// ═══════════════════════════════════════════
function showReadyOverlay(myName, opName) {
  document.getElementById('myReadyName').textContent = myName;
  document.getElementById('opReadyName').textContent = opName;
  setMyReadyState(false);
  setOpReadyState(false);
  const btn = document.getElementById('startBtn');
  btn.disabled = false;
  btn.textContent = 'START';
  document.getElementById('readyOverlay').classList.add('visible');
}

function hideReadyOverlay() {
  document.getElementById('readyOverlay').classList.remove('visible');
}

function setMyReadyState(ready) {
  document.getElementById('myReadySlot').classList.toggle('ready', ready);
  document.getElementById('myReadyState').textContent = ready ? 'READY' : 'NOT READY';
}

function setOpReadyState(ready) {
  document.getElementById('opReadySlot').classList.toggle('ready', ready);
  document.getElementById('opReadyState').textContent = ready ? 'READY' : 'NOT READY';
}

function sendReady() {
  const btn = document.getElementById('startBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'WAITING...';
  setMyReadyState(true);
  wsSend('ready', {});
}

// ═══════════════════════════════════════════
//  SERVER MESSAGE HANDLER
// ═══════════════════════════════════════════
function handleServerMsg(msg) {
  switch (msg.type) {
    case 'waiting':
      break;
    case 'match_found': {
      const myName = getMyName();
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('battleScreen').classList.remove('hidden');
      document.getElementById('myNameTag').textContent = myName;
      document.getElementById('opNameTag').textContent = msg.data.opponent;
      document.getElementById('roomIdTag').textContent = msg.data.room_id;
      showReadyOverlay(myName, msg.data.opponent);
      break;
    }
    case 'opponent_ready':
      setOpReadyState(true);
      break;
    case 'game_start':
      hideReadyOverlay();
      startBattle();
      break;
    case 'opponent_board':
      drawOpponentBoard(msg.data);
      break;
    case 'opponent_attack':
      receiveGarbage(msg.data.lines);
      break;
    case 'you_win':
      showResult(true);
      break;
    case 'you_lose':
      showResult(false);
      break;
    case 'opponent_left':
      if (gameActive) showResult(true, '對手已離線');
      break;
    case 'error':
      setStatus('Error: ' + msg.data);
      break;
  }
}

// ═══════════════════════════════════════════
//  PIECE / BAG
// ═══════════════════════════════════════════
function shuffleBag() {
  const types = Object.keys(SHAPES);
  for (let i = types.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [types[i], types[j]] = [types[j], types[i]];
  }
  return types;
}

function nextFromBag() {
  if (pieceBag.length === 0) pieceBag = shuffleBag();
  return pieceBag.pop();
}

function createPiece(type) {
  return {
    type,
    cells: SHAPES[type].map(c => [...c]),
    x: SPAWN_X,
    y: SPAWN_Y,
    rot: 0
  };
}

function rotateCells(cells, dir) {
  let maxX = 0, maxY = 0;
  cells.forEach(([x, y]) => { maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); });
  const size = Math.max(maxX, maxY) + 1;
  return cells.map(([x, y]) => dir === 1 ? [size - 1 - y, x] : [y, size - 1 - x]);
}

// Cells above the playfield (ny<0) are treated as non-colliding here;
// top-out is detected separately in lockPiece() / spawnNext() / applyGarbage().
function collides(cells, offsetX, offsetY) {
  return cells.some(([cx, cy]) => {
    const nx = cx + offsetX;
    const ny = cy + offsetY;
    if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
    if (ny < 0) return false;
    return grid[ny][nx] !== null;
  });
}

function tryRotate(dir) {
  const rotated = rotateCells(currentPiece.cells, dir);
  const targetRot = (currentPiece.rot + dir + 4) % 4;
  const tests = KICKS[dir === 1 ? currentPiece.rot : targetRot];
  for (const [kx, ky] of tests) {
    const dx = dir === 1 ? kx : -kx;
    const dy = dir === 1 ? -ky : ky;
    if (!collides(rotated, currentPiece.x + dx, currentPiece.y + dy)) {
      currentPiece.cells = rotated;
      currentPiece.x += dx;
      currentPiece.y += dy;
      currentPiece.rot = targetRot;
      lockTimer = 0;
      return true;
    }
  }
  return false;
}

function getGhostY() {
  let y = currentPiece.y;
  while (!collides(currentPiece.cells, currentPiece.x, y + 1)) y++;
  return y;
}

// Lock-out: piece locks with at least one cell above the visible playfield.
function isLockOut(piece) {
  return piece.cells.some(([cx, cy]) => cy + piece.y < 0);
}

// Block-out: freshly spawned piece directly overlaps a filled cell in the playfield.
function isBlockOut(piece) {
  return piece.cells.some(([cx, cy]) => {
    const nx = cx + piece.x;
    const ny = cy + piece.y;
    if (ny < 0 || ny >= ROWS || nx < 0 || nx >= COLS) return false;
    return grid[ny][nx] !== null;
  });
}

// ═══════════════════════════════════════════
//  GAME ACTIONS
// ═══════════════════════════════════════════
function lockPiece() {
  if (isLockOut(currentPiece)) {
    triggerTopOut('方塊堆頂了！');
    return;
  }
  currentPiece.cells.forEach(([cx, cy]) => {
    const nx = cx + currentPiece.x;
    const ny = cy + currentPiece.y;
    if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS) {
      grid[ny][nx] = currentPiece.type;
    }
  });
  clearLines();
  applyGarbage();
  if (!gameActive) return;
  spawnNext();
}

function clearLines() {
  let cleared = 0;
  for (let y = ROWS - 1; y >= 0; y--) {
    if (grid[y].every(v => v !== null)) {
      grid.splice(y, 1);
      grid.unshift(new Array(COLS).fill(null));
      cleared++;
      y++;
    }
  }
  if (cleared === 0) return;

  score += [0, 100, 300, 500, 800][cleared] * level;
  lines += cleared;
  level = Math.floor(lines / 10) + 1;
  dropInterval = Math.max(50, 1000 - (level - 1) * 80);

  // Attack: garbage lines = cleared - 1 (single=0, double=1, triple=2, tetris=3)
  const attackLines = cleared - 1;
  if (attackLines > 0) {
    if (pendingGarbage > 0) {
      const canceled = Math.min(pendingGarbage, attackLines);
      pendingGarbage -= canceled;
      const remaining = attackLines - canceled;
      if (remaining > 0) wsSend('attack', { lines: remaining });
    } else {
      wsSend('attack', { lines: attackLines });
    }
    flashAttack(attackLines);
  }
  updateGarbageBar();
  updateMyUI();
}

function spawnNext() {
  currentPiece = createPiece(nextQueue.shift());
  nextQueue.push(nextFromBag());
  canHold = true;
  lockTimer = 0;
  lockMoveCount = 0;
  if (isBlockOut(currentPiece)) {
    triggerTopOut('方塊堆頂了！');
    return;
  }
  drawNext();
  drawHold();
}

function holdSwap() {
  if (!canHold) return;
  canHold = false;
  const currentType = currentPiece.type;
  if (heldPiece) {
    currentPiece = createPiece(heldPiece);
  } else {
    currentPiece = createPiece(nextQueue.shift());
    nextQueue.push(nextFromBag());
  }
  heldPiece = currentType;
  lockTimer = 0;
  lockMoveCount = 0;
  drawHold();
  drawNext();
}

// ═══════════════════════════════════════════
//  GARBAGE
// ═══════════════════════════════════════════
function receiveGarbage(n) {
  pendingGarbage += n;
  updateGarbageBar();
}

function applyGarbage() {
  if (pendingGarbage <= 0) return;
  const n = pendingGarbage;

  // Top-out if existing blocks would be pushed above the playfield.
  for (let i = 0; i < n; i++) {
    if (grid[i].some(v => v !== null)) {
      triggerTopOut('被對手的垃圾行淹沒了！');
      return;
    }
  }

  pendingGarbage = 0;
  for (let i = 0; i < n; i++) {
    grid.shift();
    const row = new Array(COLS).fill('G');
    row[Math.floor(Math.random() * COLS)] = null;
    grid.push(row);
  }
  updateGarbageBar();
}

function updateGarbageBar() {
  const bar = document.getElementById('myGarbageBar');
  bar.innerHTML = '';
  for (let i = 0; i < Math.min(pendingGarbage, 20); i++) {
    const seg = document.createElement('div');
    seg.className = 'garbage-segment';
    bar.appendChild(seg);
  }
}

function flashAttack(n) {
  const fill = document.getElementById('attackFill');
  fill.style.width = Math.min(n * 33, 100) + '%';
  setTimeout(() => { fill.style.width = '0%'; }, 600);
}

function triggerTopOut(reason) {
  if (!gameActive) return;
  gameActive = false;
  wsSend('game_over', {});
  showResult(false, reason);
}

// ═══════════════════════════════════════════
//  DRAWING
// ═══════════════════════════════════════════
function drawBlock(ctx, x, y, type, size, alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = COLORS[type] || '#555';
  ctx.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x * size + 1, y * size + 1, size - 2, 2);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(x * size + 1, y * size + size - 3, size - 2, 2);
  ctx.globalAlpha = 1;
}

function drawGrid(ctx, size) {
  ctx.fillStyle = BOARD_BG;
  ctx.fillRect(0, 0, COLS * size, ROWS * size);
  ctx.strokeStyle = GRID_LINE;
  ctx.lineWidth = 0.3;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * size, 0);
    ctx.lineTo(x * size, ROWS * size);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * size);
    ctx.lineTo(COLS * size, y * size);
    ctx.stroke();
  }
}

function drawGridContents(ctx, board, size) {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const v = board[y] ? board[y][x] : null;
      if (v) drawBlock(ctx, x, y, v, size);
    }
  }
}

function drawMyBoard() {
  drawGrid(myCx, BLOCK_SIZE);
  drawGridContents(myCx, grid, BLOCK_SIZE);

  if (!currentPiece || !gameActive) return;

  const ghostY = getGhostY();
  currentPiece.cells.forEach(([cx, cy]) => {
    const nx = cx + currentPiece.x;
    const ny = cy + ghostY;
    if (ny < 0) return;
    myCx.fillStyle = 'rgba(255,255,255,0.06)';
    myCx.fillRect(nx * BLOCK_SIZE + 1, ny * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
  });
  currentPiece.cells.forEach(([cx, cy]) => {
    const nx = cx + currentPiece.x;
    const ny = cy + currentPiece.y;
    if (ny < 0) return;
    drawBlock(myCx, nx, ny, currentPiece.type, BLOCK_SIZE);
  });
}

function drawOpponentBoard(data) {
  if (!data) return;
  drawGrid(opCx, OP_BLOCK_SIZE);
  if (data.grid) drawGridContents(opCx, data.grid, OP_BLOCK_SIZE);
  document.getElementById('opScore').textContent = data.score || 0;
  document.getElementById('opLines').textContent = data.lines || 0;
}

function drawMini(ctx, type, offsetX, offsetY, size) {
  const cells = SHAPES[type];
  let minX = 9, maxX = 0, minY = 9, maxY = 0;
  cells.forEach(([x, y]) => {
    minX = Math.min(minX, x);
    maxX = Math.max(maxX, x);
    minY = Math.min(minY, y);
    maxY = Math.max(maxY, y);
  });
  const w = maxX - minX + 1;
  const h = maxY - minY + 1;
  const sx = offsetX + (4 - w) * size / 2 - minX * size;
  const sy = offsetY + (2 - h) * size / 2 - minY * size;
  ctx.fillStyle = COLORS[type];
  cells.forEach(([cx, cy]) => {
    ctx.fillRect(sx + cx * size + 1, sy + cy * size + 1, size - 2, size - 2);
  });
}

function drawHold() {
  myHoldCx.clearRect(0, 0, 60, 48);
  if (heldPiece) drawMini(myHoldCx, heldPiece, 2, 8, 11);
}

function drawNext() {
  myNextCx.clearRect(0, 0, 60, 130);
  nextQueue.forEach((t, i) => drawMini(myNextCx, t, 2, 4 + i * 32, 10));
}

function updateMyUI() {
  document.getElementById('myScore').textContent = score;
  document.getElementById('myLines').textContent = lines;
  document.getElementById('myLevel').textContent = level;
}

function syncBoard() {
  wsSend('board_state', { grid, score, lines, level });
}

// ═══════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════
function handleKey(e) {
  if (!gameActive) return;
  switch (e.key) {
    case 'ArrowLeft':
      if (!collides(currentPiece.cells, currentPiece.x - 1, currentPiece.y)) {
        currentPiece.x--;
        lockTimer = 0;
      }
      break;
    case 'ArrowRight':
      if (!collides(currentPiece.cells, currentPiece.x + 1, currentPiece.y)) {
        currentPiece.x++;
        lockTimer = 0;
      }
      break;
    case 'ArrowDown':
      if (!collides(currentPiece.cells, currentPiece.x, currentPiece.y + 1)) {
        currentPiece.y++;
        score += 1;
        dropTimer = 0;
      }
      break;
    case 'ArrowUp':
    case 'x':
    case 'X':
      tryRotate(1);
      break;
    case 'z':
    case 'Z':
      tryRotate(-1);
      break;
    case ' ': {
      let distance = 0;
      while (!collides(currentPiece.cells, currentPiece.x, currentPiece.y + 1)) {
        currentPiece.y++;
        distance++;
      }
      score += distance * 2;
      lockPiece();
      break;
    }
    case 'c':
    case 'C':
      holdSwap();
      break;
    default:
      return;
  }
  e.preventDefault();
  updateMyUI();
}
document.addEventListener('keydown', handleKey);

// ═══════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════
function gameLoop(now) {
  if (!gameActive) return;

  const dt = now - lastFrameTime;
  lastFrameTime = now;
  dropTimer += dt;

  if (dropTimer >= dropInterval) {
    dropTimer = 0;
    if (!collides(currentPiece.cells, currentPiece.x, currentPiece.y + 1)) {
      currentPiece.y++;
    }
  }

  if (collides(currentPiece.cells, currentPiece.x, currentPiece.y + 1)) {
    lockTimer += dt;
    if (lockTimer >= LOCK_DELAY_MS || lockMoveCount >= MAX_LOCK_MOVES) {
      lockPiece();
      if (!gameActive) return;
      lockTimer = 0;
    }
  } else {
    lockTimer = 0;
  }

  syncTimer += dt;
  if (syncTimer >= SYNC_INTERVAL_MS) {
    syncTimer = 0;
    syncBoard();
  }

  const elapsed = Math.floor((Date.now() - gameStartMs) / 1000);
  const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const ss = String(elapsed % 60).padStart(2, '0');
  document.getElementById('gameTime').textContent = mm + ':' + ss;

  drawMyBoard();
  requestAnimationFrame(gameLoop);
}

function startBattle() {
  grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
  pieceBag = [];
  nextQueue = [nextFromBag(), nextFromBag(), nextFromBag(), nextFromBag()];
  heldPiece = null;
  canHold = true;
  score = 0;
  lines = 0;
  level = 1;
  dropInterval = 1000;
  dropTimer = 0;
  lockTimer = 0;
  lockMoveCount = 0;
  pendingGarbage = 0;
  syncTimer = 0;
  gameStartMs = Date.now();
  gameActive = true;
  lastFrameTime = performance.now();

  currentPiece = createPiece(nextQueue.shift());
  nextQueue.push(nextFromBag());

  updateMyUI();
  drawHold();
  drawNext();
  drawMyBoard();
  drawGrid(opCx, OP_BLOCK_SIZE);
  updateGarbageBar();

  document.body.focus();
  requestAnimationFrame(gameLoop);
}

function surrenderGame() {
  triggerTopOut('你投降了');
}

function showResult(win, reason) {
  const overlay = document.getElementById('resultOverlay');
  if (overlay.classList.contains('visible')) return;

  gameActive = false;
  const elapsed = Math.floor((Date.now() - gameStartMs) / 1000);
  const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const ss = String(elapsed % 60).padStart(2, '0');

  const title = document.getElementById('resultTitle');
  title.textContent = win ? 'YOU WIN!' : 'YOU LOSE';
  title.className = 'result-title ' + (win ? 'win' : 'lose');
  document.getElementById('resultSub').textContent = reason || '';
  document.getElementById('resultStats').innerHTML =
    'Score: ' + score + '<br>Lines: ' + lines + '<br>Level: ' + level + '<br>Time: ' + mm + ':' + ss;
  overlay.classList.add('visible');
}
</script>
